name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and unit test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Package the bridge plugin
        run: npm run bridge:zip

      - name: CLI smoke test
        shell: bash
        run: |
          node dist/cli.js version
          node dist/cli.js tools > tools.txt
          grep -q wp_content_get tools.txt
          count=$(grep -c '^  wp_' tools.txt)
          echo "tools listed: $count"
          test "$count" -eq 39
